name: Assemble Sagittarius Web Engine 2

on:
  push:
    branches: [main]
    paths:
      - ".deploy-parts/**"
      - ".github/workflows/assemble-web.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Rebuild verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy-parts/part-*.txt | base64 --decode > /tmp/sag-web2.tar.gz
          echo "4aedea3ddd1eda7e2c707046327d4316a9633b4315dfbd3e5e16e46333803180  /tmp/sag-web2.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sag-web2.tar.gz -C .
          rm -rf .deploy-parts
          rm -f .github/workflows/assemble-web.yml
      - name: Commit Web Engine 2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sagittarius Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Launch Sagittarius Web Engine 2 with Tesseract 6"
          git push origin HEAD:main
